# 폴링 폴백: 새 디스커션 디스코드 알림
# discussion-notify.yml(discussion 이벤트 방식)이 org 디스커션에서 발화하지 않을 경우의 대비책.
# 평소에는 workflow_dispatch(수동 실행)만 열어 두고,
# 이벤트 방식 실패가 확인되면 아래 schedule 주석을 해제해 10분 주기 폴링으로 전환한다.
# 주의: schedule 트리거는 이 파일이 default 브랜치에 있어야 동작한다.
name: Discussion Discord Notify (Poll Fallback)

on:
  workflow_dispatch:
  # 이벤트 방식(discussion-notify.yml)이 발화하지 않으면 아래 두 줄의 주석을 해제
  # schedule:
  #   - cron: '*/10 * * * *'

permissions:
  contents: read
  discussions: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      # 스크립트는 git 조작을 하지 않으므로 토큰을 워크스페이스(.git/config)에 남기지 않는다.
      # (GraphQL 조회용 토큰은 아래 스텝의 env로만 주입)
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 마지막 확인 시각(.poll-marker)을 Actions 캐시로 실행 간 이어받는다.
      # 캐시는 불변(같은 key에 재저장 불가)이므로 key를 run_id로 매번 다르게 저장하고,
      # 복원은 restore-keys 접두어 매칭으로 가장 최근에 저장된 마커를 가져온다.
      # path는 스크립트의 MARKER_FILE 기본값(.poll-marker)과 일치해야 한다.
      - name: Restore poll marker
        uses: actions/cache/restore@v6
        with:
          path: .poll-marker
          key: poll-marker-${{ github.run_id }}
          restore-keys: |
            poll-marker-

      - name: Poll new discussions and notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCUSSION_CATEGORIES: ${{ vars.DISCUSSION_CATEGORIES }}
          POLL_LOOKBACK_MINUTES: ${{ vars.POLL_LOOKBACK_MINUTES }}
        run: node scripts/poll-new-discussions.mjs

      # 주의: GitHub Actions 캐시는 7일간 미사용 시 자동 삭제된다 (폴링 중단 7일 후 마커 소실).
      # 마커가 없으면 스크립트가 "최근 POLL_LOOKBACK_MINUTES(기본 30분) 내 글만 알림"으로
      # 폴백하므로 과거 글 폭주는 없다. 대신 중단 기간의 글은 알림이 누락되므로,
      # 오래 중단했다 재개할 때는 POLL_LOOKBACK_MINUTES를 크게 잡아 1회 수동 실행하면 보충된다.
      # (이 스텝은 폴링 성공 시에만 실행됨 — 실패 시 이전 마커가 유지되어 다음 실행에서 재시도)
      - name: Save poll marker
        uses: actions/cache/save@v6
        with:
          path: .poll-marker
          key: poll-marker-${{ github.run_id }}
