# 새 디스커션 등록 시 디스코드 알림
# 주의: discussion 이벤트는 이 파일이 default 브랜치에 있어야 동작한다.
name: Discussion Discord Notify

on:
  discussion:
    types: [created]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # 스크립트는 git 조작을 하지 않으므로 토큰을 워크스페이스(.git/config)에 남기지 않는다.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCUSSION_CATEGORIES: ${{ vars.DISCUSSION_CATEGORIES }}
        run: node scripts/notify-discussion.mjs
