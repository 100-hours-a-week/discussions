# 새 디스커션 등록 시 디스코드 알림
# 주의: discussion 이벤트는 이 파일이 default 브랜치에 있어야 동작한다.
name: Discussion Discord Notify

on:
  discussion:
    types: [created]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # 스크립트는 git 조작을 하지 않으므로 토큰을 워크스페이스(.git/config)에 남기지 않는다.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Send Discord notification
        env:
          # 봇 모드: DISCORD_BOT_TOKEN이 있으면 봇으로(피드 채널 발송 후 스레드 생성),
          # 없으면 아래 웹훅으로 자동 폴백한다(무중단).
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FEED_CHANNEL_ID: ${{ vars.FEED_CHANNEL_ID }}
          REMIND_CHANNEL_ID: ${{ vars.REMIND_CHANNEL_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          # 채널 분리: 새 글·코멘트 피드 웹훅이 있으면 그쪽으로, 없으면 기존 단일 웹훅으로 폴백
          DISCORD_WEBHOOK_URL_FEED: ${{ secrets.DISCORD_WEBHOOK_URL_FEED }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCUSSION_CATEGORIES: ${{ vars.DISCUSSION_CATEGORIES }}
        run: node scripts/notify-discussion.mjs
