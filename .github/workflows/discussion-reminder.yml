# 미답변 디스커션 리마인드
# cron은 UTC 기준: '0 9 * * 4' = 매주 목요일 18:00 KST
# 멘토링 요일이 다르면 cron만 수정하면 된다. (KST - 9시간 = UTC)
# 주의: schedule 트리거는 이 파일이 default 브랜치에 있어야 동작한다.
name: Unanswered Discussion Reminder

on:
  schedule:
    - cron: '0 9 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  discussions: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      # 스크립트는 git 조작을 하지 않으므로 토큰을 워크스페이스(.git/config)에 남기지 않는다.
      # (GraphQL 조회용 토큰은 아래 스텝의 env로만 주입)
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Send reminder to Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 봇 모드: DISCORD_BOT_TOKEN이 있으면 봇으로(리마인드 채널 발송),
          # 없으면 아래 웹훅으로 자동 폴백한다(무중단).
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FEED_CHANNEL_ID: ${{ vars.FEED_CHANNEL_ID }}
          REMIND_CHANNEL_ID: ${{ vars.REMIND_CHANNEL_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          # 채널 분리: 리마인드 전용 웹훅이 있으면 그쪽으로, 없으면 기존 단일 웹훅으로 폴백
          DISCORD_WEBHOOK_URL_REMIND: ${{ secrets.DISCORD_WEBHOOK_URL_REMIND }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCUSSION_CATEGORIES: ${{ vars.DISCUSSION_CATEGORIES }}
          REMIND_SINCE: ${{ vars.REMIND_SINCE }}
          ANSWERED_LABELS: ${{ vars.ANSWERED_LABELS }}
          MENTION_CONTENT: ${{ vars.MENTION_CONTENT }}
          REQUIRE_ASSIGNED_MENTOR_ANSWER: ${{ vars.REQUIRE_ASSIGNED_MENTOR_ANSWER }}
          # 멘토 매핑(사내 핸들 → 깃헙 로그인) JSON 문자열 — mentors.json 파일은 배포하지 않는다
          MENTORS_JSON: ${{ secrets.MENTORS_JSON }}
        run: node scripts/remind-unanswered.mjs
